# Memory: keep modest; see README (4 GB agent scope on the build machine).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The app version: versionName, and versionCode = major*10000 + minor*100 + patch. Release CI sets it from the tag.
telltype.version=1.0.1
