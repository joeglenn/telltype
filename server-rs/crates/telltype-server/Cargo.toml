[package]
name = "telltype-server"
description = "Telltype Server: one binary for speech to text and the text models of the Telltype dictation app"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "telltype-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
axum-server.workspace = true
rustls.workspace = true
telltype-config.workspace = true
telltype-http.workspace = true
telltype-speech.workspace = true
telltype-supervisor.workspace = true
telltype-upstream.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
telltype-speech = { workspace = true, features = ["test-support"] }
telltype-upstream = { workspace = true, features = ["test-support"] }
reqwest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
