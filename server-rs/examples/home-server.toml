# MACHINE-SPECIFIC EXAMPLE: a complete home-server configuration, with both text models supervised.
# Paths and model names are one real machine's; adjust them to yours. The ports (8170 public, 8172
# cleanup, 8173 Command Mode) are the ones the README uses.
#
# Copy it to the configuration directory (~/.config/telltype/server.toml), next to gate.key and tls/
# (mode = "files" keeps a certificate that clients have already pinned), and install
# systemd/telltype-server.service.

[server]
listen = "0.0.0.0:8170"
shutdown_grace_s = 10

[tls]
mode = "files"                       # keep the certificate the phone has pinned
cert_file = "tls/cert.pem"
key_file = "tls/key.pem"

[auth]
key_file = "gate.key"

[speech]
model_dir = "~/models/dictation/sherpa-onnx-nemo-parakeet-unified-en-0.6b-int8-non-streaming"
model_name = "parakeet-unified-en-0.6b-int8"
threads = 8
max_concurrent = 2
max_waiting = 6                      # at most 8 speech requests in flight
hotwords = false

[text.cleanup]
url = "http://127.0.0.1:8172"
model = "gemma-4-e4b-it-qat-q4_0"
aliases = { cleanup = "gemma-4-e4b-it-qat-q4_0" }   # deprecated name, still accepted
timeout_s = 60
max_in_flight = 4

[text.cleanup.supervise]
binary = "~/llama.cpp/build/bin/llama-server"
args = [
    "--model", "~/models/dictation/gemma-4-E4B_q4_0-it.gguf",
    "--alias", "gemma-4-e4b-it-qat-q4_0",
    "--n-gpu-layers", "999", "--parallel", "1", "--ctx-size", "8192", "--threads", "4",
    "--cache-ram", "0", "--no-webui", "--jinja", "--reasoning", "off", "--reasoning-budget", "0",
]

[text.commands]
url = "http://127.0.0.1:8173"
model = "qwen_qwen3.5-4b-q4_k_m"
aliases = { assistant = "qwen_qwen3.5-4b-q4_k_m" }   # deprecated name, still accepted
timeout_s = 120
max_in_flight = 2

[text.commands.supervise]
binary = "~/llama.cpp/build/bin/llama-server"
args = ["--no-webui", "--jinja", "--reasoning", "off", "--reasoning-budget", "0"]

[text.commands.supervise.router]
model_dirs = ["~/models/dictation"]
models_ini = "~/llama.cpp/models.ini"
presets_file = "~/.local/state/telltype/commands-presets.ini"
models_max = 1
defaults = { n-gpu-layers = "999", ctx-size = "8192", parallel = "1", cache-ram = "0", threads = "4" }
