name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation and what gets in your way today. A concrete example helps most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Telltype help?
      description: What you imagine it doing. Rough is fine.
  - type: dropdown
    id: part
    attributes:
      label: Part
      options:
        - Android app
        - Telltype Server
        - Both / not sure
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried or considered
